version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: docker/8.2/Dockerfile
        image: fie-api-app
        container_name: fie-api-app
        restart: unless-stopped
        environment:
            WWWGROUP: "1000"
            WWWUSER: "1000"
            APP_ENV: local
            APP_DEBUG: "true"
            APP_KEY: ${APP_KEY}
            APP_URL: ${APP_URL}
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: null
            CACHE_DRIVER: database
            QUEUE_CONNECTION: database
            SESSION_DRIVER: database
            MAIL_MAILER: log
        volumes:
            - ./:/var/www/html
        ports:
            - "8000:80"
        depends_on:
            - db
            - redis

    db:
        image: mysql:8.0
        container_name: fie-api-db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: devashac_fie_uat
            MYSQL_USER: devashac_fie_uat
            MYSQL_PASSWORD: 7?a1Mg21g
        ports:
            - "3307:3306"
        volumes:
            - dbdata:/var/lib/mysql
            - ./docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/create-testing-database.sh

    redis:
        image: redis:alpine
        container_name: fie-api-redis
        restart: unless-stopped
        ports:
            - "6379:6379"

volumes:
    dbdata:
